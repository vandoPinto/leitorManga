<!doctype html>
<html lang="pt-BR">

<head>
	<title>Biblioteca de mangás</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="css/library.css" />
	<!-- <link rel="icon" type="image/png" href="../../pics/favicon.png" /> -->
	<script type="text/javascript" src="extras/jquery.min.1.7.js"></script>
	<script type="text/javascript" src="extras/jquery-ui-1.8.20.custom.min.js"></script>
	<script type="text/javascript" src="extras/modernizr.2.5.3.min.js"></script>
	<script type="text/javascript" src="lib/hash.js"></script>
</head>

<body class="library-mode">
	<main id="library" class="library" aria-labelledby="library-title">
		<header class="library-header">
			<p class="eyebrow">Leitor de mangá - do papai Vando para minha princesa Alice</p>
			<h1 id="library-title">Death Note</h1>
			<p>Escolha um volume para começar a leitura.</p>
		</header>
		<p id="library-status" class="library-status" role="status">Carregando volumes…</p>
		<section id="manga-list" class="manga-list" aria-label="Volumes disponíveis"></section>
	</main>

	<header id="reader-controls" class="reader-controls" hidden>
		<button id="back-to-library" class="back-button" type="button">← Biblioteca</button>
		<div class="reader-heading">
			<strong id="reader-title">Death Note</strong>
			<span id="page-counter" aria-live="polite"></span>
		</div>
		<label class="volume-picker">
			<span>Volume</span>
			<select id="volume-picker" aria-label="Selecionar volume"></select>
		</label>
		<button class="zoom-icon zoom-icon-in" type="button" aria-label="Ampliar página"></button>
	</header>

	<div id="canvas" class="reader-canvas">

		<div class="magazine-viewport">
			<div class="container">

				<div class="magazine">
					<!-- Next button -->
					<div ignore="1" class="next-button"></div>
					<!-- Previous button -->
					<div ignore="1" class="previous-button"></div>
				</div>

				<div class="atividade" style="display: none;"></div>
			</div>
		</div>
		<div class="bottom">
			<div id="slider-bar" class="turnjs-slider">
				<div id="slider"></div>
			</div>
		</div>

		<script type="text/javascript">

			function loadApp() {

				$('#canvas').fadeIn(1000);

				var flipbook = $('.magazine');

				// Check if the CSS was already loaded

				if (flipbook.width() == 0 || flipbook.height() == 0) {
					setTimeout(loadApp, 10);
					return;
				}

				// Create the flipbook

				flipbook.turn({

					// Magazine width

					width: 1000,
					height: 700,


					// Duration in millisecond

					duration: 1000,

					// Enables gradients

					gradients: true,

					// Auto center this flipbook

					autoCenter: true,

					// Elevation from the edge of the flipbook when turning a page

					elevation: 50,

					// The number of pages

					pages: window.currentManga.pages.length,

					// Events

					when: {
						turning: function (event, page, view) {

							var book = $(this),
								currentPage = book.turn('page'),
								pages = book.turn('pages');

							// Update the current URI

							Hash.go('page/' + page).update();

							// Show and hide navigation buttons

							disableControls(page);

						},

						turned: function (event, page, view) {

							disableControls(page);

							$(this).turn('center');

							$('#slider').slider('value', getViewNumber($(this), page));
							$('#page-counter').text('Página ' + page + ' de ' + window.currentManga.pages.length);

							if (page == 1 && $(this).turn('display') === 'double') {
								$(this).turn('peel', 'br');
							}

							loadScript(page);
						},

						missing: function (event, pages) {

							// Add pages that aren't in the magazine

							for (var i = 0; i < pages.length; i++)
								addPage(pages[i], $(this));

						}
					}

				});

				// Zoom.js

				$('.magazine-viewport').zoom({
					flipbook: $('.magazine'),

					max: function () {

						return largeMagazineWidth() / $('.magazine').width();

					},

					when: {
						swipeLeft: function () {

							$(this).zoom('flipbook').turn('next');

						},

						swipeRight: function () {

							$(this).zoom('flipbook').turn('previous');

						},

						resize: function (event, scale, page, pageElement) {

							if (scale == 1)
								loadSmallPage(page, pageElement);
							else
								loadLargePage(page, pageElement);

						},

						zoomIn: function () {

							$('#slider-bar').hide();
							$('.made').hide();
							$('.magazine').removeClass('animated').addClass('zoom-in');
							$('.zoom-icon').removeClass('zoom-icon-in').addClass('zoom-icon-out');

							if (!window.escTip && !$.isTouch) {
								escTip = true;

								$('<div />', { 'class': 'exit-message' }).
									html('<div>Press ESC to exit</div>').
									appendTo($('body')).
									delay(2000).
									animate({ opacity: 0 }, 500, function () {
										$(this).remove();
									});
							}
						},

						zoomOut: function () {

							$('#slider-bar').fadeIn();
							$('.exit-message').hide();
							$('.made').fadeIn();
							$('.zoom-icon').removeClass('zoom-icon-out').addClass('zoom-icon-in');

							setTimeout(function () {
								$('.magazine').addClass('animated').removeClass('zoom-in');
								resizeViewport();
							}, 0);

						}
					}
				});

				// Zoom event

				// if ($.isTouch)
				// 	$('.magazine-viewport').bind('zoom.doubleTap', zoomTo);
				// else
				// $('.magazine-viewport').bind('zoom.tap', zoomTo);

				if ($.isTouch) {
					$('.magazine-viewport').bind('zoom.doubleTap', zoomTo);
				} else {
					$('.magazine-viewport').on('dblclick', zoomTo);
				}



				// Using arrow keys to turn the page

				$(document).keydown(function (e) {
					if (!$('#canvas').is(':visible'))
						return;

					var previous = 37, next = 39, esc = 27;

					switch (e.keyCode) {
						case previous:

							// left arrow
							$('.magazine').turn('previous');
							e.preventDefault();

							break;
						case next:

							//right arrow
							$('.magazine').turn('next');
							e.preventDefault();

							break;
						case esc:

							$('.magazine-viewport').zoom('zoomOut');
							e.preventDefault();

							break;
					}
				});

				// URIs - Format #/page/1 

				Hash.on('^page\/([0-9]*)$', {
					yep: function (path, parts) {
						var page = parts[1];

						if (page !== undefined) {
							if ($('.magazine').turn('is'))
								$('.magazine').turn('page', page);
						}

					},
					nop: function (path) {

						if ($('.magazine').turn('is'))
							$('.magazine').turn('page', 1);
					}
				});


				$(window).resize(function () {
					resizeViewport();
				}).bind('orientationchange', function () {
					resizeViewport();
				});

				// Regions

				if ($.isTouch) {
					$('.magazine').bind('touchstart', regionClick);
				} else {
					$('.magazine').click(regionClick);
				}

				// Events for the next button

				$('.next-button').bind($.mouseEvents.over, function () {

					$(this).addClass('next-button-hover');

				}).bind($.mouseEvents.out, function () {

					$(this).removeClass('next-button-hover');

				}).bind($.mouseEvents.down, function () {

					$(this).addClass('next-button-down');

				}).bind($.mouseEvents.up, function () {

					$(this).removeClass('next-button-down');

				}).click(function () {

					$('.magazine').turn('next');

				});

				// Events for the next button

				$('.previous-button').bind($.mouseEvents.over, function () {

					$(this).addClass('previous-button-hover');

				}).bind($.mouseEvents.out, function () {

					$(this).removeClass('previous-button-hover');

				}).bind($.mouseEvents.down, function () {

					$(this).addClass('previous-button-down');

				}).bind($.mouseEvents.up, function () {

					$(this).removeClass('previous-button-down');

				}).click(function () {

					$('.magazine').turn('previous');

				});


				// Slider

				$("#slider").slider({
					min: 1,
					max: numberOfViews(flipbook),

					start: function (event, ui) {

						if (!window._thumbPreview) {
							_thumbPreview = $('<div />', { 'class': 'thumbnail' }).html('<div></div>');
							// setPreview(ui.value);
							// _thumbPreview.appendTo($(ui.handle));
						}
						// else
						// setPreview(ui.value);

						moveBar(false);

					},

					slide: function (event, ui) {

						setPreview(ui.value);

					},

					stop: function () {

						if (window._thumbPreview)
							_thumbPreview.removeClass('show');

						var book = $('.magazine');
						var selectedPage = book.turn('display') === 'single'
							? $(this).slider('value')
							: $(this).slider('value') * 2 - 2;
						book.turn('page', Math.max(1, selectedPage));

					}
				});

				resizeViewport();

				$('.magazine').addClass('animated');

			}

			// Zoom icon

			$('.zoom-icon').bind('mouseover', function () {

				if ($(this).hasClass('zoom-icon-in'))
					$(this).addClass('zoom-icon-in-hover');

				if ($(this).hasClass('zoom-icon-out'))
					$(this).addClass('zoom-icon-out-hover');

			}).bind('mouseout', function () {

				if ($(this).hasClass('zoom-icon-in'))
					$(this).removeClass('zoom-icon-in-hover');

				if ($(this).hasClass('zoom-icon-out'))
					$(this).removeClass('zoom-icon-out-hover');

			}).bind('click', function () {

				if ($(this).hasClass('zoom-icon-in'))
					$('.magazine-viewport').zoom('zoomIn');
				else if ($(this).hasClass('zoom-icon-out'))
					$('.magazine-viewport').zoom('zoomOut');

			});

			$('#canvas').hide();


			// Load the HTML4 version if there's not CSS transform

			yepnope({
				test: Modernizr.csstransforms,
				yep: ['lib/turn.min.js'],
				nope: ['lib/turn.html4.min.js', 'css/jquery.ui.html4.css'],
				both: ['lib/zoom.js', 'css/jquery.ui.css', 'js/magazine.js', 'css/magazine.css'],
				complete: initializeLibrary
			});

			function initializeLibrary() {
				fetch('manga-manifest.json')
					.then(function (response) {
						if (!response.ok)
							throw new Error('Não foi possível carregar o catálogo estático.');
						return response.json();
					})
					.then(function (volumes) {
						if (!volumes.length) {
							$('#library-status').text('Nenhum volume foi encontrado no catálogo.');
							return;
						}

						$('#library-status').text(volumes.length + ' volumes disponíveis');
						var list = document.getElementById('manga-list');
						var picker = document.getElementById('volume-picker');

						volumes.forEach(function (volume) {
							var card = document.createElement('button');
							card.type = 'button';
							card.className = 'manga-card';
							card.addEventListener('click', function () { openManga(volume); });

							var cover = document.createElement('img');
							cover.className = 'manga-cover';
							cover.src = toAssetUrl(volume.cover);
							cover.alt = '';
							cover.loading = 'lazy';

							var details = document.createElement('span');
							details.className = 'manga-card-details';
							var title = document.createElement('strong');
							title.textContent = volume.title;
							var count = document.createElement('span');
							count.textContent = volume.pageCount + ' páginas';
							details.appendChild(title);
							details.appendChild(count);
							card.appendChild(cover);
							card.appendChild(details);
							list.appendChild(card);

							var option = document.createElement('option');
							option.value = volume.id;
							option.textContent = volume.title;
							picker.appendChild(option);
						});

						window.mangaCatalog = volumes;
						$('#volume-picker').on('change', function () {
							var volume = volumes.find(function (item) { return item.id === this.value; }, this);
							if (volume)
								openManga(volume);
						});
						$('#back-to-library').on('click', showLibrary);
					})
					.catch(function (error) {
						$('#library-status').text(error.message + ' Abra o site publicado pelo GitHub Pages.');
					});
			}

			function toAssetUrl(relativePath) {
				return relativePath.split('/').map(encodeURIComponent).join('/');
			}

			function openManga(volume) {
				window.currentManga = volume;
				document.body.classList.remove('library-mode');
				document.getElementById('library').hidden = true;
				document.getElementById('reader-controls').hidden = false;
				document.getElementById('reader-title').textContent = volume.title;
				document.getElementById('volume-picker').value = volume.id;
				$('#page-counter').text('Página 1 de ' + volume.pageCount);
				$('#canvas').show();

				var book = $('.magazine');
				if (!book.turn('is')) {
					loadApp();
					return;
				}

				if ($('.magazine-viewport').zoom('value') !== 1)
					$('.magazine-viewport').zoom('zoomOut');
				book.turn('stop');
				book.turn('page', 1);
				book.turn('pages', volume.pageCount);
				var loadedPages = book.data().pageObjs;
				for (var page in loadedPages) {
					if (Object.prototype.hasOwnProperty.call(loadedPages, page) && Number(page) > 0 && Number(page) <= volume.pageCount)
						loadPage(Number(page), $(loadedPages[page]));
				}
				$('#slider').slider('option', 'max', numberOfViews(book));
				$('#slider').slider('value', 1);
				Hash.go('page/1').update();
			}

			function showLibrary() {
				document.getElementById('reader-controls').hidden = true;
				$('#canvas').hide();
				document.getElementById('library').hidden = false;
				document.body.classList.add('library-mode');
			}

		</script>
</body>

</html>
